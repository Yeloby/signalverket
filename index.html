<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signalverket</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #07091c;
        color: #f7f8ff;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 8%, #1e2769 0, transparent 34%),
          radial-gradient(circle at 84% 86%, #5a165e 0, transparent 33%),
          #07091c;
      }
      main {
        width: min(100%, 790px);
        height: 100vh;
        height: 100dvh;
        max-height: 850px;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: clamp(10px, 2vh, 20px);
        padding: clamp(10px, 2.5vmin, 30px);
        overflow: hidden;
      }
      header {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
      }
      .menu-button {
        grid-column: 3;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid #7c8cff77;
        border-radius: 50%;
        color: #f7f8ff;
        background: #11152ddd;
        font: inherit;
        font-size: 1.4rem;
        cursor: pointer;
      }
      h1 {
        grid-column: 2;
        grid-row: 1;
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        letter-spacing: .13em;
        text-transform: uppercase;
        text-shadow: 0 0 25px #4eeaff88;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .stat {
        padding: 10px;
        border: 1px solid #4eeaff55;
        border-radius: 14px;
        background: #11152dcc;
        text-align: center;
      }
      .label {
        display: block;
        color: #98a3d7;
        font-size: .72rem;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      .value { font-size: 1.35rem; font-weight: 800; }
      .board-space {
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: center;
        container-type: size;
      }
      #board {
        width: min(100cqw, 100cqh, 620px);
        aspect-ratio: 1;
        display: grid;
        grid-template-columns: repeat(var(--board-size, 6), 1fr);
        gap: clamp(3px, .8vw, 8px);
        padding: clamp(7px, 1.4vw, 13px);
        border: 1px solid #7c8cff66;
        border-radius: 22px;
        background: #090d24cc;
        box-shadow: 0 20px 70px #0009, inset 0 0 35px #5068ff19;
      }
      .tile {
        min-width: 0;
        padding: 0;
        border: 1px solid #7d8bb933;
        border-radius: 15%;
        background: linear-gradient(145deg, #18203b, #0d1127);
        color: #52628b;
        cursor: pointer;
        transition: transform .12s, color .2s, box-shadow .2s;
      }
      .tile:hover, .tile:focus-visible {
        transform: scale(1.04);
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .tile.selected { border-color: #fff8; }
      .tile.powered {
        color: #56f5ff;
        background: linear-gradient(145deg, #183b52, #101b39);
        box-shadow: inset 0 0 18px #36eaff38, 0 0 12px #36eaff35;
      }
      #board.complete {
        border-color: #69ff9b;
        animation: complete-pulse .7s ease-out;
      }
      @keyframes complete-pulse {
        50% { box-shadow: 0 0 55px #69ff9b66, inset 0 0 35px #69ff9b33; }
      }
      .tile:first-child {
        color: #fff;
        box-shadow: inset 0 0 20px #ff4edc77, 0 0 18px #ff4edc66;
      }
      .tile svg { display: block; width: 100%; height: 100%; }
      .tile path, .tile circle {
        fill: currentColor;
        stroke: currentColor;
        stroke-width: 13;
        stroke-linecap: round;
      }
      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
      }
      #status {
        display: none;
        min-width: 0;
        margin: 0;
        color: #bdc6ee;
        line-height: 1.25;
      }
      #status.success {
        display: block;
        color: #69ff9b;
        font-weight: 800;
      }
      #new-game {
        flex: 0 0 auto;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        color: #081020;
        background: linear-gradient(90deg, #55efff, #f75cda);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }
      dialog {
        width: min(calc(100% - 28px), 430px);
        padding: 0;
        border: 1px solid #7c8cff77;
        border-radius: 22px;
        color: #f7f8ff;
        background: #0d1127;
        box-shadow: 0 25px 90px #000c;
      }
      dialog::backdrop {
        background: #050714bb;
        backdrop-filter: blur(6px);
      }
      .menu-panel { padding: 24px; }
      .menu-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .menu-heading h2, .about h3 { margin: 0; }
      .close-menu {
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: #252b4b;
        font: inherit;
        font-size: 1.25rem;
        cursor: pointer;
      }
      .option {
        display: grid;
        gap: 7px;
        margin-top: 20px;
        color: #bdc6ee;
      }
      .option select, .secondary-button {
        border: 1px solid #7c8cff66;
        border-radius: 12px;
        padding: 10px 12px;
        color: #fff;
        background: #161b38;
        font: inherit;
      }
      .check-option {
        grid-template-columns: 1fr auto;
        align-items: center;
      }
      .check-option input { width: 20px; height: 20px; accent-color: #56f5ff; }
      .secondary-button { margin-top: 16px; cursor: pointer; }
      .about {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #7c8cff44;
        color: #aeb8e8;
        line-height: 1.55;
      }
      .about p { margin: 8px 0 0; }
      @media (max-height: 720px), (max-width: 520px) {
        main {
          grid-template-rows: auto auto minmax(0, 1fr) auto;
          padding: 8px;
          gap: 7px;
        }
        h1 { font-size: clamp(1.35rem, 7vw, 1.9rem); }
        .stat { padding: 5px; border-radius: 10px; }
        .value { font-size: 1.05rem; }
        #board {
          padding: 6px;
          gap: 3px;
          border-radius: 14px;
        }
        #new-game { padding: 9px 13px; }
      }
      @media (max-width: 430px) {
        .stats { gap: 5px; }
        .stat { padding-inline: 3px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          transition-duration: .01ms !important;
        }
      }
      .no-animations *, .no-animations *::before, .no-animations *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
      @media (max-width: 390px), (max-height: 560px) {
        .label { font-size: .6rem; }
        .controls { gap: 7px; }
        #new-game { font-size: .78rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Signalverket</h1>
        <button class="menu-button" id="open-menu" type="button" aria-label="Åpne meny">☰</button>
      </header>
      <section class="stats" aria-label="Spillstatus">
        <div class="stat"><span class="label">Tid</span><span class="value" id="time">00:00</span></div>
        <div class="stat"><span class="label">Trekk</span><span class="value" id="moves">0</span></div>
        <div class="stat"><span class="label">Aktive</span><span class="value" id="powered">1/36</span></div>
        <div class="stat"><span class="label">Rekord</span><span class="value" id="best">—</span></div>
      </section>
      <div class="board-space">
        <section id="board" aria-label="Signalnett"></section>
      </div>
      <div class="controls">
        <p id="status" aria-live="polite">Koble energikilden til hele nettet.</p>
        <button id="new-game" type="button">Nytt nett</button>
      </div>
    </main>
    <dialog id="menu-dialog" aria-labelledby="menu-title">
      <div class="menu-panel">
        <div class="menu-heading">
          <h2 id="menu-title">Meny</h2>
          <button class="close-menu" id="close-menu" type="button" aria-label="Lukk meny">×</button>
        </div>
        <label class="option">
          Brettstørrelse
          <select id="board-size">
            <option value="5">5 × 5 – lett</option>
            <option value="6">6 × 6 – normal</option>
            <option value="7">7 × 7 – vanskelig</option>
          </select>
        </label>
        <label class="option check-option">
          <span>Animasjoner</span>
          <input id="animations" type="checkbox" checked>
        </label>
        <button class="secondary-button" id="reset-best" type="button">Nullstill tidsrekord</button>
        <section class="about">
          <h3>Om Signalverket</h3>
          <p>Et neonfarget logikkspill laget av <strong>Johan Slåttavik</strong>. Koble energikilden til hele nettet ved å rotere forbindelsene.</p>
        </section>
      </div>
    </dialog>
    <script type="module" src="main.js"></script>
  </body>
</html>
